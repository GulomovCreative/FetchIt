# Sites that install FetchIt only from packages, e.g. to try an upgrade from
# 1.x or 3.x. The dev sites of compose.yml mount the component directories
# of this repository, so any FetchIt package installed there writes its
# files into the working copy. Here the repository is mounted read-only,
# and the project has its own name, containers, volumes and ports
# (!override needs Docker Compose 2.24.4 or later):
#
#   docker compose -f compose.yml -f compose.clean.yml up -d --build
#   MODX 2: http://localhost:8062/   MODX 3: http://localhost:8063/
#
# Build the package on the dev site (build.php writes into _packages/, which
# is read-only here), put old releases from GitHub into _packages/prev/, then
# install 1.x on modx2 or 3.x on modx3 and upgrade to the new package:
#
#   docker compose -f compose.yml -f compose.clean.yml exec -u www-data modx3 \
#       php /extra/_build/ci/install.php /extra/_packages/prev/fetchit-3.1.4-pl.transport.zip
#   docker compose -f compose.yml -f compose.clean.yml exec -u www-data modx3 \
#       php /extra/_build/ci/install.php /extra/_packages/fetchit-<version>-<release>.transport.zip
#
# fixtures.php prints its JSON here instead of writing a file.

name: fetchit-clean

services:
  db:
    ports: !override
      - "13362:3306"

  modx2:
    environment:
      MODX_HTTP_HOST: "localhost:8062"
    ports: !override
      - "8062:80"
    volumes: !override
      - modx2:/var/www/html
      - ./:/extra:ro

  modx3:
    environment:
      MODX_HTTP_HOST: "localhost:8063"
    ports: !override
      - "8063:80"
    volumes: !override
      - modx3:/var/www/html
      - ./:/extra:ro
