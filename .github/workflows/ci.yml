name: CI

on:
  push:
    branches: [master, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step.
    shell: bash

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: php -l
        run: |
          # php -l names the broken file on stdout; show only those lines.
          find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l | { grep -v '^No syntax errors' || true; }

  php-tests:
    name: PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

  php-store:
    name: Database store on MySQL, MariaDB and SQL Server
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fetchit
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fetchit
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: FetchIt-Test-2026
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlsrv
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 60); do
            php -r 'new PDO("sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1", "sa", "FetchIt-Test-2026");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "::error::SQL Server did not start"
          exit 1

      - name: MySQL 8
        env:
          FETCHIT_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=fetchit
          FETCHIT_TEST_USER: root
          FETCHIT_TEST_PASSWORD: root
        run: vendor/bin/phpunit --filter 'DbStoreTest|StoreResolverTest|GuardTest'

      - name: MariaDB 11
        env:
          FETCHIT_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=fetchit
          FETCHIT_TEST_USER: root
          FETCHIT_TEST_PASSWORD: root
        run: vendor/bin/phpunit --filter 'DbStoreTest|StoreResolverTest|GuardTest'

      - name: SQL Server 2022
        env:
          FETCHIT_TEST_DSN: sqlsrv:Server=127.0.0.1,1433;Database=master;TrustServerCertificate=1
          FETCHIT_TEST_USER: sa
          FETCHIT_TEST_PASSWORD: FetchIt-Test-2026
        run: vendor/bin/phpunit --filter 'DbStoreTest|StoreResolverTest|GuardTest'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Committed build matches src/
        run: npm run build:check

      - name: The build runs in every browser of browserslist (ES2019)
        run: npm run check:syntax

  scripts:
    name: Workflows and shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: shellcheck
        run: shellcheck -x _build/ci/*.sh docker/php/entrypoint.sh

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - run: php _build/ci/version.php

  package:
    needs: [php-lint, php-tests, frontend, scripts, version]
    uses: ./.github/workflows/package.yml

  integration:
    needs: package
    uses: ./.github/workflows/integration.yml
