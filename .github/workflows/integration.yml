name: Integration

# Installs the package from the "package" artifact on MODX 2 and MODX 3, on a
# clean site and over a release of the old line for that MODX (matrix.from:
# 1.x on MODX 2, 3.x on MODX 3), then submits forms over HTTP and from a real
# browser. pdoTools replaces the parser of the whole site, so it is only
# installed on the upgrade jobs; the clean ones run on the core MODX parser.

on:
  workflow_call:

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step.
    shell: bash

jobs:
  modx:
    name: MODX ${{ matrix.modx }} / PHP ${{ matrix.php }}${{ matrix.from && format(' / from {0}', matrix.from) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - modx: 2.8.6-pl
            php: '7.4'
          - modx: 2.8.6-pl
            php: '7.4'
            from: v1.1.3
            pdotools: true
          - modx: 3.2.4-pl
            php: '8.3'
          - modx: 3.2.4-pl
            php: '8.3'
            from: v3.1.4
            pdotools: true

    env:
      MODX_ROOT: /tmp/modx
      MODX_CORE_PATH: /tmp/modx/core/
      BASE_URL: http://127.0.0.1:8080

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, mbstring, pdo_mysql, simplexml, zip
          coverage: none
          tools: none

      - uses: actions/cache@v6
        with:
          path: ~/modx-${{ matrix.modx }}.zip
          key: modx-${{ matrix.modx }}

      - name: Install MODX
        env:
          MODX_HTTP_HOST: 127.0.0.1:8080
          MODX_VERSION: ${{ matrix.modx }}
        run: |
          _build/ci/modx-download.sh "$MODX_VERSION" "$MODX_ROOT" ~/modx-"$MODX_VERSION".zip
          _build/ci/modx-setup.sh

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: _packages

      - name: Install the previous release
        if: matrix.from
        env:
          FROM: ${{ matrix.from }}
        run: |
          zip="fetchit-${FROM#v}-pl.transport.zip"
          curl -fsSL -o "/tmp/$zip" "https://github.com/${{ github.repository }}/releases/download/$FROM/$zip"
          php _build/ci/install.php "/tmp/$zip"

      - name: Install the package
        run: php _build/ci/install.php _packages/*.transport.zip

      - name: Install pdoTools
        if: matrix.pdotools
        run: php _build/ci/provider-install.php pdoTools

      - name: Create the test pages
        run: |
          php _build/ci/fixtures.php fixtures.json
          cat fixtures.json

      - name: Turn off the fill time and rate checks
        # The HTTP and browser checks send forms right after loading them,
        # many times; the protection steps below turn both checks back on
        # one at a time.
        run: |
          php _build/ci/setting.php fetchit.protection.min_time 0
          php _build/ci/setting.php fetchit.protection.rate_limit 0

      - name: Start the web server
        # request_order=GPC puts cookies into $_REQUEST, as on servers without
        # a php.ini. The cookie check in smoke.sh only bites with it.
        # The checks change system settings between requests; MODX keeps them
        # in PHP cache files, which OPcache would serve stale for up to
        # revalidate_freq seconds.
        run: |
          php -d request_order=GPC -d opcache.revalidate_freq=0 -S 127.0.0.1:8080 -t "$MODX_ROOT" > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null "$BASE_URL/" && exit 0; sleep 1; done
          echo "::error::The web server did not start"
          cat server.log
          exit 1

      - name: HTTP checks
        env:
          # The setup resolver installs FormIt together with FetchIt;
          # pdoTools comes from the step above.
          REQUIRE_FORMIT: 1
          REQUIRE_PDOTOOLS: ${{ matrix.pdotools && '1' || '' }}
        run: |
          EXPECT_PACKAGE="$(basename _packages/*.transport.zip .transport.zip)" \
            _build/ci/smoke.sh "$BASE_URL" "$(cat fixtures.json)"

      - name: HTTP checks without anonymous sessions
        env:
          REQUIRE_FORMIT: 1
          REQUIRE_PDOTOOLS: ${{ matrix.pdotools && '1' || '' }}
        run: |
          php _build/ci/setting.php anonymous_sessions 0
          _build/ci/smoke.sh "$BASE_URL" "$(cat fixtures.json)"

      - name: Turn anonymous sessions back on
        if: always()
        run: php _build/ci/setting.php anonymous_sessions 1

      - name: Protection refuses a form sent too fast
        run: |
          php _build/ci/setting.php fetchit.protection.min_time 4
          _build/ci/protection.sh "$BASE_URL" "$(cat fixtures.json)" too-fast

      - name: Turn the time check back off
        if: always()
        run: php _build/ci/setting.php fetchit.protection.min_time 0

      - name: Protection limits submissions per address
        run: |
          php _build/ci/setting.php fetchit.protection.rate_limit 2
          _build/ci/protection.sh "$BASE_URL" "$(cat fixtures.json)" rate-limit

      - name: Turn the rate limit back off
        if: always()
        run: php _build/ci/setting.php fetchit.protection.rate_limit 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
          FIXTURES="$(cat fixtures.json)" npm run e2e

      - name: Browser checks with the default fill time
        run: |
          php _build/ci/setting.php fetchit.protection.min_time 3
          FIXTURES="$(cat fixtures.json)" E2E_TAG=timing npm run e2e

      - name: Turn the fill time check back off
        if: always()
        run: php _build/ci/setting.php fetchit.protection.min_time 0

      - name: Browser checks with the default notifier
        run: |
          php _build/ci/setting.php fetchit.frontend.default.notifier 1
          FIXTURES="$(cat fixtures.json)" E2E_TAG=notifier npm run e2e

      - name: Turn the default notifier back off
        if: always()
        run: php _build/ci/setting.php fetchit.frontend.default.notifier 0

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-modx-${{ matrix.modx }}${{ matrix.from && format('-from-{0}', matrix.from) || '' }}
          path: |
            server.log
            playwright-report/
            ${{ env.MODX_ROOT }}/core/cache/logs/
          if-no-files-found: ignore
