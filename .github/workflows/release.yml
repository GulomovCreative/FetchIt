name: Release

# Publishing a GitHub release builds the package, checks it on MODX 2 and
# MODX 3, and attaches it to the release together with notes from the commit
# history. Started by hand, it only builds and checks the package; the zip is
# kept in the run's artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: The tag names the version
        run: php _build/ci/version.php "${{ github.event_name == 'release' && github.ref_name || '' }}"

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  integration:
    needs: package
    uses: ./.github/workflows/integration.yml

  publish:
    name: Publish
    needs: [package, integration]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes need the history back to the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: _packages

      - name: Write the notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: _packages/notes.md

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNATURE: ${{ needs.package.outputs.signature }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          # A rerun must not add the notes twice.
          if ! grep -q '<!-- changelog -->' <<< "$body"; then
            {
              if [ -n "$body" ]; then printf '%s\n\n' "$body"; fi
              echo '<!-- changelog -->'
              cat _packages/notes.md
            } > _packages/release.md
            gh release edit "$TAG" --notes-file _packages/release.md
          fi
          gh release upload "$TAG" "_packages/$SIGNATURE.transport.zip" --clobber
