name: Release

# Pushing a tag vX.Y.Z builds the package, checks it on MODX 2 and MODX 3,
# and only then creates the GitHub release with the package and notes from
# the commit history. Started by hand, it only builds and checks the
# package; the zip is kept in the run's artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

# Everything but the publish job runs third-party code (npm packages, the
# MODX release), so it gets a read-only token.
permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step.
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: The tag names the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: php _build/ci/version.php "$TAG"

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  integration:
    needs: package
    uses: ./.github/workflows/integration.yml

  publish:
    name: Publish
    needs: [package, integration]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes need the history back to the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: _packages

      - name: Write the notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: _packages/notes.md

      - name: Fall back to the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A release of only chore, ci or docs commits has no notes.
          if ! grep -q '[^[:space:]]' _packages/notes.md; then
            version="${TAG#v}"
            version="${version%-pl}"
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { show = 1; next }
              show && /^## \[/ { exit }
              show { print }
            ' core/components/fetchit/docs/changelog.txt > _packages/notes.md
          fi
          grep -q '[^[:space:]]' _packages/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNATURE: ${{ needs.package.outputs.signature }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun: refresh the notes and the package.
            gh release edit "$TAG" --notes-file _packages/notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file _packages/notes.md
          fi
          gh release upload "$TAG" "_packages/$SIGNATURE.transport.zip" --clobber
