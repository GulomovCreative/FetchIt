; Development settings for the MODX containers.

memory_limit = 256M
max_execution_time = 300
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = UTC

display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On

; Edits to the mounted component must show up on the next request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
